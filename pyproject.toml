[project]
name = "ha-ai-usage"
version = "0.0.1"
description = "Home Assistant integration for AI subscription and API usage"
requires-python = ">=3.14"
license = "MIT"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "A",    # builtins
    "ASYNC",
    "B",    # bugbear
    "C4",   # comprehensions
    "D",    # docstrings
    "E",
    "F",
    "FLY",
    "G",    # logging format
    "I",    # isort
    "LOG",
    "PERF",
    "PIE",
    "PL",   # pylint
    "PT",   # pytest style
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T20",  # no print
    "UP",
    "W",
]
ignore = [
    "D202",    # blank line after function docstring
    "D203",    # conflicts with D211
    "D213",    # conflicts with D212
    "E501",    # line length (formatter handles it)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic values
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D107", "PLR0917", "PLR2004", "SLF001"]
"scripts/**" = ["T201"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.ai_usage", "tests", "ai_usage_app", "ai_usage_core"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-self", "truthy-iterable"]
packages = ["custom_components.ai_usage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = [
    "custom_components/ai_usage",
    "ai_usage_app/rootfs/opt/ai_usage/ai_usage_app",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
